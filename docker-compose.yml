# Self-hosted B1 stack: Caddy (HTTPS) + MySQL + Api + B1Admin + B1App, all behind one domain.
#   /        B1App  (church website + member portal)
#   /admin   B1Admin
#   /api     Api (REST, uploads, websocket)
# Install and upgrade with ./deploy/b1 (it writes the .env with real secrets). Every value below has a localhost default.

name: b1church

services:
  caddy:
    image: caddy:2.10
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - api
      - b1admin
      - b1app
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-churchapps}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    image: ghcr.io/churchapps/b1-api:${B1_VERSION:-stable}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET:-please-change-this-jwt-secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-PleaseChangeThisDockerDefaultKey}
      FILE_STORE: ${FILE_STORE:-disk}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      DELIVERY_PROVIDER: local
      CONTENT_ROOT: ${PUBLIC_URL:-http://localhost}/api/content
      SOCKET_URL: ${PUBLIC_URL:-http://localhost}/api/
      B1ADMIN_ROOT: ${PUBLIC_URL:-http://localhost}/admin
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      MAIL_SYSTEM: ${MAIL_SYSTEM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      GOOGLE_RECAPTCHA_SECRET_KEY: ${GOOGLE_RECAPTCHA_SECRET_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      PEXELS_KEY: ${PEXELS_KEY:-}
      VIMEO_TOKEN: ${VIMEO_TOKEN:-}
      API_BIBLE_KEY: ${API_BIBLE_KEY:-}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      MEMBERSHIP_CONNECTION_STRING: mysql://root:${MYSQL_ROOT_PASSWORD:-churchapps}@mysql:3306/membership
      ATTENDANCE_CONNECTION_STRING: mysql://root:${MYSQL_ROOT_PASSWORD:-churchapps}@mysql:3306/attendance
      CONTENT_CONNECTION_STRING: mysql://root:${MYSQL_ROOT_PASSWORD:-churchapps}@mysql:3306/content
      GIVING_CONNECTION_STRING: mysql://root:${MYSQL_ROOT_PASSWORD:-churchapps}@mysql:3306/giving
      MESSAGING_CONNECTION_STRING: mysql://root:${MYSQL_ROOT_PASSWORD:-churchapps}@mysql:3306/messaging
      DOING_CONNECTION_STRING: mysql://root:${MYSQL_ROOT_PASSWORD:-churchapps}@mysql:3306/doing
      DOING_MEMBERSHIP_CONNECTION_STRING: mysql://root:${MYSQL_ROOT_PASSWORD:-churchapps}@mysql:3306/membership
      REPORTING_CONNECTION_STRING: mysql://root:${MYSQL_ROOT_PASSWORD:-churchapps}@mysql:3306/reporting
      COMMONS_CONNECTION_STRING: mysql://root:${MYSQL_ROOT_PASSWORD:-churchapps}@mysql:3306/commons
    volumes:
      - api-content:/app/content
    restart: unless-stopped

  b1admin:
    image: ghcr.io/churchapps/b1-admin:${B1_VERSION:-stable}
    restart: unless-stopped

  b1app:
    image: ghcr.io/churchapps/b1-app:${B1_VERSION:-stable}
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      B1_API_INTERNAL_URL: http://api:8084
      DEFAULT_CHURCH_SLUG: ${DEFAULT_CHURCH_SLUG:-church}
    restart: unless-stopped

volumes:
  mysql-data:
  api-content:
  caddy-data:
