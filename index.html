<!doctype html>
<html lang="en" data-theme="b1">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1976d2" />

    />
    <title>B1.church Admin</title>
    <script>
      try {
        var s = localStorage.getItem("b1admin-omarchy-skin");
        if (s !== "b1" && s !== "harbor" && s !== "ridge" && s !== "tyro" && s !== "lake" && s !== "one") s = "b1";
        document.documentElement.setAttribute("data-theme", s);
      } catch (e) {}
    </script>
    <!-- temp - undo bootstrap  -->
    <style>
      button:focus {
        outline: none;
      }
    </style>
  </head>

  </body>
