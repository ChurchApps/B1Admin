on:
  pull_request:
    paths:
      - "tests/**"

name: Test areas

permissions:
  contents: read

jobs:
  check:
    name: Every spec is in an area
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Check tests/areas.json
        run: node tests/setup/affected.mjs --check
