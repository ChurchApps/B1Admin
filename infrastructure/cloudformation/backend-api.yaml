          MESSAGING_CONNECTION_STRING: !Sub
            - "mysql://${DatabaseMasterUsername}:{{resolve:secretsmanager:${DatabaseSecretArn}:SecretString:password}}@${DatabaseHost}:${DatabasePort}/${ResolvedMessagingDatabaseName}"
            - DatabaseHost: !GetAtt DatabaseCluster.Endpoint.Address
              DatabaseSecretArn: !Ref DatabaseMasterSecret
              ResolvedMessagingDatabaseName: !If [HasMessagingDatabaseName, !Ref MessagingDatabaseName, "messaging"]

  Timer15MinRule:
    Type: AWS::Events::Rule
    Condition: CreateScheduledWorkers
    Properties:
      ScheduleExpression: rate(30 minutes)
      State: ENABLED
      Targets:
