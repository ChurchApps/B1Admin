  TimerWebhooksLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateScheduledWorkers
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${EnvironmentName}-timer-webhooks"
      RetentionInDays: 30

  TimerWebhooksFunction:
    Type: AWS::Lambda::Function
    Condition: CreateScheduledWorkers
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-timer-webhooks"
      Code:
        S3Bucket: !Ref LambdaCodeS3Bucket
        S3Key: !Ref LambdaCodeS3Key
      Handler: !Ref TimerWebhooksLambdaHandler
      Runtime: !Ref LambdaRuntime
      Architectures:
        - !Ref LambdaArchitecture
      Layers:
        - !If [HasDependenciesLayerArn, !Ref DependenciesLayerArn, !Ref "AWS::NoValue"]
        - !If [HasObservabilityLayerArn, !Ref ObservabilityLayerArn, !Ref "AWS::NoValue"]
      MemorySize: 256
      Timeout: 120
      Role: !GetAtt ApiFunctionRole.Arn
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Environment:
        Variables:
          APP_ENV: !Ref EnvironmentName
          ENVIRONMENT: !Ref EnvironmentName
          STAGE: !Ref EnvironmentName
          NODE_OPTIONS: !Ref LambdaNodeOptions
          WEBSOCKET_API_ID: !If [CreateWebSocketApi, !Ref BackendWebSocketApi, ""]
          AI_PROVIDER: !Ref AiProvider
          EMAIL_ON_REGISTRATION: !Ref EmailOnRegistration
          CADDY_HOST: !Ref CaddyHost
          CADDY_PORT: !Ref CaddyPort
          MEMBERSHIP_CONNECTION_STRING: !Sub
            - "mysql://${DatabaseMasterUsername}:{{resolve:secretsmanager:${DatabaseSecretArn}:SecretString:password}}@${DatabaseHost}:${DatabasePort}/${ResolvedMembershipDatabaseName}"
            - DatabaseHost: !GetAtt DatabaseCluster.Endpoint.Address
              DatabaseSecretArn: !Ref DatabaseMasterSecret
              ResolvedMembershipDatabaseName: !If [HasMembershipDatabaseName, !Ref MembershipDatabaseName, !Ref DatabaseName]

  TimerWebhooksRule:
    Type: AWS::Events::Rule
    Condition: CreateScheduledWorkers
    Properties:
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Arn: !GetAtt TimerWebhooksFunction.Arn
          Id: timerWebhooksTarget

  TimerWebhooksInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: CreateScheduledWorkers
    Properties:
      FunctionName: !Ref TimerWebhooksFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TimerWebhooksRule.Arn

  BackendHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-http-api"
      ProtocolType: HTTP
      CorsConfiguration:
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        AllowOrigins:
          - "*"
        AllowHeaders:
          - authorization
          - content-type
          - x-requested-with
        ExposeHeaders:
          - content-type
        MaxAge: 86400

  BackendHttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref BackendHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: "2.0"

  BackendHttpApiRouteDefault:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref BackendHttpApi
      RouteKey: "$default"
      Target: !Sub "integrations/${BackendHttpApiIntegration}"

  BackendHttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref BackendHttpApi
      StageName: "$default"
      AutoDeploy: true

  BackendHttpApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: CreateApiCustomDomain
    Properties:
      DomainName: !Ref ApiCustomDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  BackendHttpApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: CreateApiCustomDomain
    Properties:
      ApiId: !Ref BackendHttpApi
      DomainName: !Ref BackendHttpApiDomainName
      Stage: !Ref BackendHttpApiStage

  BackendHttpApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateApiDnsRecord
    Properties:
      HostedZoneId: !Ref ApiHostedZoneId
      Name: !Ref ApiCustomDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt BackendHttpApiDomainName.RegionalDomainName
        HostedZoneId: !GetAtt BackendHttpApiDomainName.RegionalHostedZoneId
        EvaluateTargetHealth: false

  BackendHttpApiDnsRecordIpv6:
    Type: AWS::Route53::RecordSet
    Condition: CreateApiDnsRecord
    Properties:
      HostedZoneId: !Ref ApiHostedZoneId
      Name: !Ref ApiCustomDomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt BackendHttpApiDomainName.RegionalDomainName
        HostedZoneId: !GetAtt BackendHttpApiDomainName.RegionalHostedZoneId
        EvaluateTargetHealth: false

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${BackendHttpApi}/*/*"

Outputs:
  ApiBaseUrl:
    Description: Public base URL for the backend API.
    Value: !If
      - CreateApiCustomDomain
      - !Sub "https://${ApiCustomDomainName}"
      - !Sub "https://${BackendHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  PublicApiBaseUrl:
    Description: Alias output for frontend deployment tooling.
    Value: !If
      - CreateApiCustomDomain
      - !Sub "https://${ApiCustomDomainName}"
      - !Sub "https://${BackendHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  ApiFunctionName:
    Value: !Ref ApiFunction
  ApiFunctionArn:
    Value: !GetAtt ApiFunction.Arn
  MigrationFunctionName:
    Value: !If [RunMigrationResources, !Ref MigrationFunction, ""]
  SocketFunctionName:
    Value: !If [CreateWebSocketApi, !Ref SocketFunction, ""]
  WebSocketApiId:
    Value: !If [CreateWebSocketApi, !Ref BackendWebSocketApi, ""]
  WebSocketApiEndpoint:
    Value: !If
      - CreateWebSocketApi
      - !Sub "wss://${BackendWebSocketApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${EnvironmentName}"
      - ""
  Timer15MinFunctionName:
    Value: !If [CreateScheduledWorkers, !Ref Timer15MinFunction, ""]
  TimerMidnightFunctionName:
    Value: !If [CreateScheduledWorkers, !Ref TimerMidnightFunction, ""]
  TimerScheduledTasksFunctionName:
    Value: !If [CreateScheduledWorkers, !Ref TimerScheduledTasksFunction, ""]
  TimerWebhooksFunctionName:
    Value: !If [CreateScheduledWorkers, !Ref TimerWebhooksFunction, ""]
  DatabaseEndpoint:
    Value: !GetAtt DatabaseCluster.Endpoint.Address
  DatabaseClusterArn:
    Value: !GetAtt DatabaseCluster.DBClusterArn
  DatabaseReaderEndpoint:
    Value: !GetAtt DatabaseCluster.ReadEndpoint.Address
  DatabasePort:
    Value: !Ref DatabasePort
  DatabaseName:
    Value: !Ref DatabaseName
  MembershipDatabaseName:
    Value: !If [HasMembershipDatabaseName, !Ref MembershipDatabaseName, !Ref DatabaseName]
  AttendanceDatabaseName:
    Value: !If [HasAttendanceDatabaseName, !Ref AttendanceDatabaseName, "attendance"]
  ContentDatabaseName:
    Value: !If [HasContentDatabaseName, !Ref ContentDatabaseName, "content"]
  GivingDatabaseName:
    Value: !If [HasGivingDatabaseName, !Ref GivingDatabaseName, "giving"]
  MessagingDatabaseName:
    Value: !If [HasMessagingDatabaseName, !Ref MessagingDatabaseName, "messaging"]
  DoingDatabaseName:
    Value: !If [HasDoingDatabaseName, !Ref DoingDatabaseName, "doing"]
  ReportingDatabaseName:
    Value: !If [HasReportingDatabaseName, !Ref ReportingDatabaseName, "reporting"]
  DatabaseSecretArn:
    Value: !Ref DatabaseMasterSecret
  AppConfigSecretArn:
    Value: !Ref AppConfigSecretArn
  VpcId:
    Value: !Ref BackendVpc
  PrivateSubnet1Id:
    Value: !Ref PrivateSubnet1
  PrivateSubnet2Id:
    Value: !Ref PrivateSubnet2
  LambdaSecurityGroupId:
    Value: !Ref LambdaSecurityGroup
  AssetBucketName:
    Value: !If [CreateManagedAssetBucket, !Ref ManagedAssetBucket, !Ref AssetBucketName]
  ContentRootUrl:
    Value: !If
      - HasContentRootUrl
      - !Ref ContentRootUrl
      - !If
        - HasResolvedAssetBucket
        - !Sub
          - "https://${ResolvedBucketName}.s3.${AWS::Region}.${AWS::URLSuffix}"
          - ResolvedBucketName: !If [CreateManagedAssetBucket, !Ref ManagedAssetBucket, !Ref AssetBucketName]
        - ""
  WebsiteBaseUrl:
    Value: !Ref WebsiteBaseUrl
  LessonsApiUrl:
    Value: !If
      - CreateApiCustomDomain
      - !Sub "https://${ApiCustomDomainName}"
      - !Sub "https://${BackendHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  TransferUrl:
    Value: !Ref TransferUrl
  SupportEmail:
    Value: !Ref SupportEmail
  SupportPhone:
    Value: !Ref SupportPhone
  SupportSiteUrl:
    Value: !Ref SupportSiteUrl
  MobileAppUrl:
    Value: !Ref MobileAppUrl
  DomainCnameTarget:
    Value: !Ref DomainCnameTarget
  DomainATarget:
    Value: !Ref DomainATarget
  DefaultStockPhoto:
    Value: !Ref DefaultStockPhoto
  GoogleAnalyticsTag:
    Value: !Ref GoogleAnalyticsTag
  SentryDsn:
    Value: !Ref SentryDsn
  ApiCustomDomainName:
    Value: !Ref ApiCustomDomainName
