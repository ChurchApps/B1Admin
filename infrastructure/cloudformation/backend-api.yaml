AWSTemplateFormatVersion: "2010-09-09"
Description: B1Admin backend foundation with VPC, Lambda, HTTP API, and Aurora Serverless v2.

Parameters:
  ProjectName:
    Type: String
    Default: b1admin
    AllowedPattern: "^[a-z0-9-]+$"
  EnvironmentName:
    Type: String
    Default: prod
    AllowedPattern: "^[a-z0-9-]+$"
  VpcCidr:
    Type: String
    Default: 10.30.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Default: 10.30.0.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.30.1.0/24
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.30.10.0/24
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.30.11.0/24
  CreateNatGateway:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  LambdaCodeS3Bucket:
    Type: String
    Description: S3 bucket containing the packaged backend Lambda zip.
  LambdaCodeS3Key:
    Type: String
    Description: S3 key for the packaged backend Lambda zip.
  LambdaHandler:
    Type: String
    Default: lambda.web
  LambdaRuntime:
    Type: String
    Default: nodejs22.x
    AllowedValues:
      - nodejs20.x
      - nodejs22.x
      - python3.12
      - python3.13
      - provided.al2023
  LambdaArchitecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
  LambdaMemorySize:
    Type: Number
    Default: 1024
    MinValue: 128
  LambdaTimeout:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 900
  LambdaReservedConcurrency:
    Type: Number
    Default: 0
    MinValue: 0
  DependenciesLayerArn:
    Type: String
    Default: ""
    Description: Optional Lambda layer ARN for packaged backend dependencies.
  ObservabilityLayerArn:
    Type: String
    Default: ""
    Description: Optional Lambda layer ARN for Sentry or other observability tooling.
  LambdaNodeOptions:
    Type: String
    Default: ""
    Description: Optional NODE_OPTIONS value applied to all backend Lambdas.
  EnableWebSocketApi:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  SocketLambdaHandler:
    Type: String
    Default: lambda.socket
  SocketLambdaMemorySize:
    Type: Number
    Default: 1024
    MinValue: 128
  SocketLambdaTimeout:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 900
  EnableScheduledWorkers:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  Timer15MinLambdaHandler:
    Type: String
    Default: lambda.timer15Min
  TimerMidnightLambdaHandler:
    Type: String
    Default: lambda.timerMidnight
  TimerScheduledTasksLambdaHandler:
    Type: String
    Default: lambda.timerScheduledTasks
  TimerWebhooksLambdaHandler:
    Type: String
    Default: lambda.timerWebhooks
  TimerLambdaMemorySize:
    Type: Number
    Default: 256
    MinValue: 128
  TimerLambdaTimeout:
    Type: Number
    Default: 300
    MinValue: 1
    MaxValue: 900
  RunMigrations:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Whether to create and invoke a migration Lambda as a CloudFormation custom resource.
  MigrationCodeS3Bucket:
    Type: String
    Default: ""
    Description: Optional S3 bucket for the migration Lambda package. Falls back to LambdaCodeS3Bucket when omitted.
  MigrationCodeS3Key:
    Type: String
    Default: ""
    Description: Optional S3 key for the migration Lambda package. Falls back to LambdaCodeS3Key when omitted.
  MigrationHandler:
    Type: String
    Default: ""
    Description: Optional handler for the migration Lambda. Required when RunMigrations=true.
  MigrationRuntime:
    Type: String
    Default: ""
    Description: Optional runtime for the migration Lambda. Falls back to LambdaRuntime when omitted.
  MigrationMemorySize:
    Type: Number
    Default: 1024
    MinValue: 128
  MigrationTimeout:
    Type: Number
    Default: 900
    MinValue: 1
    MaxValue: 900
  MigrationTrigger:
    Type: String
    Default: ""
    Description: Optional value to force the migration custom resource to re-run on stack update.
  DatabaseName:
    Type: String
    Default: membership
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"
    Description: Legacy/default database name. Used as the membership database when MembershipDatabaseName is not set.
  MembershipDatabaseName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-zA-Z][a-zA-Z0-9_]*$"
  AttendanceDatabaseName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-zA-Z][a-zA-Z0-9_]*$"
  ContentDatabaseName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-zA-Z][a-zA-Z0-9_]*$"
  GivingDatabaseName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-zA-Z][a-zA-Z0-9_]*$"
  MessagingDatabaseName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-zA-Z][a-zA-Z0-9_]*$"
  DoingDatabaseName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-zA-Z][a-zA-Z0-9_]*$"
  ReportingDatabaseName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-zA-Z][a-zA-Z0-9_]*$"
  DatabaseEngine:
    Type: String
    Default: aurora-mysql
    AllowedValues:
      - aurora-mysql
      - aurora-postgresql
  DatabasePort:
    Type: Number
    Default: 3306
  DatabaseMasterUsername:
    Type: String
    Default: app_admin
  DatabaseMinCapacity:
    Type: Number
    Default: 0.5
  DatabaseMaxCapacity:
    Type: Number
    Default: 2
  ApiCustomDomainName:
    Type: String
    Default: ""
    Description: Optional custom domain for the HTTP API, such as api.example.com
  ApiCertificateArn:
    Type: String
    Default: ""
    Description: Optional ACM certificate ARN for the API custom domain
  ApiHostedZoneId:
    Type: String
    Default: ""
    Description: Optional Route53 hosted zone ID for the API custom domain
  WebsiteBaseUrl:
    Type: String
    Default: ""
    Description: Public member-facing website pattern, such as https://{subdomain}.example.com
  ContentRootUrl:
    Type: String
    Default: ""
  B1AdminRootUrl:
    Type: String
    Default: ""
    Description: Public URL for the B1Admin frontend, used by backend-generated links.
  CorsOrigin:
    Type: String
    Default: "*"
  FileStore:
    Type: String
    Default: "S3"
  ManageAssetBucket:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  AssetBucketName:
    Type: String
    Default: ""
    Description: Optional S3 bucket name used by the Api repo for uploaded content when FILE_STORE=S3.
  AppConfigSecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN containing JSON fields for Api repo runtime secrets and config values.
  MailSystem:
    Type: String
    Default: "SES"
  DeliveryProvider:
    Type: String
    Default: "aws"
  StoreApiUrl:
    Type: String
    Default: ""
  AiProvider:
    Type: String
    Default: ""
  EmailOnRegistration:
    Type: String
    Default: ""
    AllowedValues: ["", "true", "false"]
  CaddyHost:
    Type: String
    Default: ""
  CaddyPort:
    Type: String
    Default: ""
  TransferUrl:
    Type: String
    Default: ""
  SupportEmail:
    Type: String
    Default: ""
  SupportPhone:
    Type: String
    Default: ""
  SupportSiteUrl:
    Type: String
    Default: ""
  MobileAppUrl:
    Type: String
    Default: ""
  DomainCnameTarget:
    Type: String
    Default: ""
  DomainATarget:
    Type: String
    Default: ""
  DefaultStockPhoto:
    Type: String
    Default: ""
  GoogleAnalyticsTag:
    Type: String
    Default: ""
  SentryDsn:
    Type: String
    Default: ""

Rules:
  ApiDomainRequiresCertificate:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref ApiCustomDomainName, ""]
          - !Not [!Equals [!Ref ApiCertificateArn, ""]]
        AssertDescription: ApiCertificateArn is required when ApiCustomDomainName is set.
  MigrationRequiresHandler:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref RunMigrations, "false"]
          - !Not [!Equals [!Ref MigrationHandler, ""]]
        AssertDescription: MigrationHandler is required when RunMigrations is true.

Conditions:
  UseNatGateway: !Equals [!Ref CreateNatGateway, "true"]
  CreatePrivateAwsEndpoints: !Equals [!Ref CreateNatGateway, "false"]
  CreatePrivateExecuteApiEndpoint: !And
    - !Condition CreatePrivateAwsEndpoints
    - !Condition CreateWebSocketApi
  CreateWebSocketApi: !Equals [!Ref EnableWebSocketApi, "true"]
  CreateScheduledWorkers: !Equals [!Ref EnableScheduledWorkers, "true"]
  RunMigrationResources: !Equals [!Ref RunMigrations, "true"]
  HasApiCustomDomainName: !Not [!Equals [!Ref ApiCustomDomainName, ""]]
  HasApiCertificateArn: !Not [!Equals [!Ref ApiCertificateArn, ""]]
  HasApiHostedZoneId: !Not [!Equals [!Ref ApiHostedZoneId, ""]]
  CreateApiCustomDomain: !And
    - !Condition HasApiCustomDomainName
    - !Condition HasApiCertificateArn
  CreateApiDnsRecord: !And
    - !Condition CreateApiCustomDomain
    - !Condition HasApiHostedZoneId
  HasWebsiteBaseUrl: !Not [!Equals [!Ref WebsiteBaseUrl, ""]]
  HasContentRootUrl: !Not [!Equals [!Ref ContentRootUrl, ""]]
  HasB1AdminRootUrl: !Not [!Equals [!Ref B1AdminRootUrl, ""]]
  HasTransferUrl: !Not [!Equals [!Ref TransferUrl, ""]]
  HasSupportEmail: !Not [!Equals [!Ref SupportEmail, ""]]
  HasSupportPhone: !Not [!Equals [!Ref SupportPhone, ""]]
  HasSupportSiteUrl: !Not [!Equals [!Ref SupportSiteUrl, ""]]
  HasMobileAppUrl: !Not [!Equals [!Ref MobileAppUrl, ""]]
  HasDomainCnameTarget: !Not [!Equals [!Ref DomainCnameTarget, ""]]
  HasDomainATarget: !Not [!Equals [!Ref DomainATarget, ""]]
  HasDefaultStockPhoto: !Not [!Equals [!Ref DefaultStockPhoto, ""]]
  HasGoogleAnalyticsTag: !Not [!Equals [!Ref GoogleAnalyticsTag, ""]]
  HasSentryDsn: !Not [!Equals [!Ref SentryDsn, ""]]
  HasReservedConcurrency: !Not [!Equals [!Ref LambdaReservedConcurrency, 0]]
  HasDependenciesLayerArn: !Not [!Equals [!Ref DependenciesLayerArn, ""]]
  HasObservabilityLayerArn: !Not [!Equals [!Ref ObservabilityLayerArn, ""]]
  HasMigrationCodeS3Bucket: !Not [!Equals [!Ref MigrationCodeS3Bucket, ""]]
  HasMigrationCodeS3Key: !Not [!Equals [!Ref MigrationCodeS3Key, ""]]
  HasMigrationRuntime: !Not [!Equals [!Ref MigrationRuntime, ""]]
  HasLambdaNodeOptions: !Not [!Equals [!Ref LambdaNodeOptions, ""]]
  UseS3FileStore: !Equals [!Ref FileStore, "S3"]
  ManageAssetBucketEnabled: !Equals [!Ref ManageAssetBucket, "true"]
  HasAssetBucketName: !Not [!Equals [!Ref AssetBucketName, ""]]
  CreateManagedAssetBucket: !And
    - !Condition UseS3FileStore
    - !Condition ManageAssetBucketEnabled
    - !Not [!Condition HasAssetBucketName]
  HasResolvedAssetBucket: !Or
    - !Condition HasAssetBucketName
    - !Condition CreateManagedAssetBucket
  HasAppConfigSecretArn: !Not [!Equals [!Ref AppConfigSecretArn, ""]]
  UseSesMailSystem: !Equals [!Ref MailSystem, "SES"]
  HasAiProvider: !Not [!Equals [!Ref AiProvider, ""]]
  HasEmailOnRegistration: !Not [!Equals [!Ref EmailOnRegistration, ""]]
  HasCaddyHost: !Not [!Equals [!Ref CaddyHost, ""]]
  HasCaddyPort: !Not [!Equals [!Ref CaddyPort, ""]]
  HasMembershipDatabaseName: !Not [!Equals [!Ref MembershipDatabaseName, ""]]
  HasAttendanceDatabaseName: !Not [!Equals [!Ref AttendanceDatabaseName, ""]]
  HasContentDatabaseName: !Not [!Equals [!Ref ContentDatabaseName, ""]]
  HasGivingDatabaseName: !Not [!Equals [!Ref GivingDatabaseName, ""]]
  HasMessagingDatabaseName: !Not [!Equals [!Ref MessagingDatabaseName, ""]]
  HasDoingDatabaseName: !Not [!Equals [!Ref DoingDatabaseName, ""]]
  HasReportingDatabaseName: !Not [!Equals [!Ref ReportingDatabaseName, ""]]

Resources:
  BackendVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-vpc"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-igw"

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref BackendVpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref BackendVpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PublicSubnet1Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public-a"

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref BackendVpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PublicSubnet2Cidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public-b"

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref BackendVpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PrivateSubnet1Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-private-a"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref BackendVpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PrivateSubnet2Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-private-b"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref BackendVpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-public-rt"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NatEip:
    Type: AWS::EC2::EIP
    Condition: UseNatGateway
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: UseNatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-nat"

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref BackendVpc
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-private-rt"

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Condition: UseNatGateway
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda security group for backend API
      VpcId: !Ref BackendVpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-lambda-sg"

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora security group for backend API
      VpcId: !Ref BackendVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref DatabasePort
          ToPort: !Ref DatabasePort
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-db-sg"

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreatePrivateAwsEndpoints
    Properties:
      GroupDescription: Interface endpoint security group for backend private AWS service access
      VpcId: !Ref BackendVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-vpce-sg"

  SecretsManagerVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreatePrivateAwsEndpoints
    Properties:
      VpcId: !Ref BackendVpc
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  S3VpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreatePrivateAwsEndpoints
    Properties:
      VpcId: !Ref BackendVpc
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds:
        - !Ref PrivateRouteTable

  PollyVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreatePrivateAwsEndpoints
    Properties:
      VpcId: !Ref BackendVpc
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.polly"
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  # WebSocket pushes call the API Gateway management API (execute-api) from
  # inside the VPC; without NAT this endpoint is the only route to it.
  # Note: SES has no usable API interface endpoint, so outbound email (and any
  # third-party integration such as payment gateways) still requires the NAT
  # gateway. See infrastructure/environments/operations.md.
  ExecuteApiVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreatePrivateExecuteApiEndpoint
    Properties:
      VpcId: !Ref BackendVpc
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.execute-api"
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the Aurora cluster
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      DBSubnetGroupName: !Sub "${ProjectName}-${EnvironmentName}-db-subnets"

  DatabaseMasterSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "Master database credentials for ${ProjectName} ${EnvironmentName}"
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DatabaseMasterUsername}"}'
        GenerateStringKey: password
        ExcludeCharacters: "\"'@/\\:?%#[]{}()<>&+=,;"

  DatabaseCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: !Ref DatabaseEngine
      DBClusterIdentifier: !Sub "${ProjectName}-${EnvironmentName}-cluster"
      DatabaseName: !If [HasMembershipDatabaseName, !Ref MembershipDatabaseName, !Ref DatabaseName]
      MasterUsername: !Ref DatabaseMasterUsername
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabaseMasterSecret}:SecretString:password}}"
      Port: !Ref DatabasePort
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref DatabaseMinCapacity
        MaxCapacity: !Ref DatabaseMaxCapacity
      StorageEncrypted: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DatabaseSecurityGroup
      EnableHttpEndpoint: true
      DeletionProtection: false
      BackupRetentionPeriod: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName

  DatabaseInstanceWriter:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref DatabaseCluster
      DBInstanceClass: db.serverless
      Engine: !Ref DatabaseEngine
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-${EnvironmentName}-writer"

  ApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-api-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: database-and-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DatabaseMasterSecret
              - Effect: Allow
                Action:
                  - rds-data:BatchExecuteStatement
                  - rds-data:BeginTransaction
                  - rds-data:CommitTransaction
                  - rds-data:ExecuteStatement
                  - rds-data:RollbackTransaction
                Resource: !GetAtt DatabaseCluster.DBClusterArn

  AppConfigSecretAccessPolicy:
    Type: AWS::IAM::Policy
    Condition: HasAppConfigSecretArn
    Properties:
      PolicyName: !Sub "${ProjectName}-${EnvironmentName}-app-config-secret"
      Roles:
        - !Ref ApiFunctionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource: !Ref AppConfigSecretArn

  WebSocketManageConnectionsPolicy:
    Type: AWS::IAM::Policy
    Condition: CreateWebSocketApi
    Properties:
      PolicyName: !Sub "${ProjectName}-${EnvironmentName}-ws-manage-connections"
      Roles:
        - !Ref ApiFunctionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - execute-api:ManageConnections
            Resource: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${BackendWebSocketApi}/*"

  AssetBucketAccessPolicy:
    Type: AWS::IAM::Policy
    Condition: HasResolvedAssetBucket
    Properties:
      PolicyName: !Sub "${ProjectName}-${EnvironmentName}-asset-bucket-access"
      Roles:
        - !Ref ApiFunctionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:AbortMultipartUpload
            Resource: !Sub
              - "arn:${AWS::Partition}:s3:::${ResolvedBucketName}/*"
              - ResolvedBucketName: !If [CreateManagedAssetBucket, !Ref ManagedAssetBucket, !Ref AssetBucketName]
          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !Sub
              - "arn:${AWS::Partition}:s3:::${ResolvedBucketName}"
              - ResolvedBucketName: !If [CreateManagedAssetBucket, !Ref ManagedAssetBucket, !Ref AssetBucketName]

  SesSendPolicy:
    Type: AWS::IAM::Policy
    Condition: UseSesMailSystem
    Properties:
      PolicyName: !Sub "${ProjectName}-${EnvironmentName}-ses-send"
      Roles:
        - !Ref ApiFunctionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ses:SendEmail
              - ses:SendRawEmail
              - ses:SendTemplatedEmail
              - ses:SendBulkTemplatedEmail
            Resource: "*"

  PollyAccessPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub "${ProjectName}-${EnvironmentName}-polly-access"
      Roles:
        - !Ref ApiFunctionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - polly:SynthesizeSpeech
            Resource: "*"

  ManagedAssetBucket:
    Type: AWS::S3::Bucket
    Condition: CreateManagedAssetBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ["*"]
